<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registro de Ventas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --tinta: #1E2A32;
    --pizarra: #14202A;
    --laton: #C8973A;
    --verde: #2F6E52;
    --papel: #F6F3EC;
    --grafito: #2B2F33;
    --borde-claro: #E7E1D2;
    --borde-oscuro: #3B4A55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: stretch;
    justify-content: center;
  }
  .num { font-family: 'Space Grotesk', sans-serif; font-variant-numeric: tabular-nums; }
  .screen {
    width: 100%;
    min-height: 100vh;
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 32px 24px 40px;
  }
  .screen.active { display: flex; }

  /* ---- Home ---- */
  #screen-home { background: var(--pizarra); color: #EFE7D8; justify-content: center; gap: 28px; }
  .home-title { font-family: 'Space Grotesk'; font-size: 28px; font-weight: 700; margin: 0; text-align: center; }
  .home-sub { opacity: 0.65; margin-top: 8px; font-size: 15px; text-align: center; }
  .home-buttons { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

  button { font-family: inherit; }
  .btn-primary {
    cursor: pointer; background: var(--laton); color: var(--pizarra); border: none;
    border-radius: 14px; padding: 20px 28px; font-size: 17px; font-weight: 600; min-width: 180px;
  }
  .btn-secondary {
    cursor: pointer; background: transparent; color: #EFE7D8; border: 2px solid var(--borde-oscuro);
    border-radius: 14px; padding: 20px 28px; font-size: 17px; font-weight: 600; min-width: 180px;
  }
  .link-btn { background: none; border: none; cursor: pointer; font-size: 14px; }

  /* ---- Vendor: name entry ---- */
  #screen-name { background: var(--pizarra); color: #EFE7D8; justify-content: center; gap: 20px; }
  .name-input {
    padding: 12px 16px; border-radius: 10px; border: 1px solid var(--borde-oscuro);
    background: var(--tinta); color: #EFE7D8; font-size: 16px; width: 220px; text-align: center;
  }
  .name-input.matched { border-color: #4C8967; }
  .name-status { font-size: 13px; min-height: 18px; margin: 0; color: #93A5B0; }
  .name-status.matched { color: #7FBF9A; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 280px; }
  .chip {
    cursor: pointer; background: var(--tinta); color: #EFE7D8; border: 1px solid var(--borde-oscuro);
    border-radius: 999px; padding: 6px 14px; font-size: 13px;
  }
  .chip.matched { background: var(--verde); }
  .btn-continue { cursor: pointer; background: var(--laton); color: var(--pizarra); border: none; border-radius: 10px; padding: 12px 24px; font-size: 16px; font-weight: 600; }
  .btn-continue[disabled] { opacity: 0.5; cursor: not-allowed; }

  /* ---- Vendor: register ---- */
  #screen-vendor { background: var(--pizarra); color: #EFE7D8; justify-content: space-between; padding-bottom: 36px; }
  .vendor-header { display: flex; justify-content: space-between; width: 100%; max-width: 420px; align-items: center; }
  .vendor-header .link-btn { color: #93A5B0; }
  .vendor-count-wrap { text-align: center; }
  .vendor-count-label { font-size: 13px; letter-spacing: 0.4px; opacity: 0.6; margin: 0; }
  .vendor-count { font-size: 76px; font-weight: 700; margin: 4px 0; }
  .vendor-count.pulse { animation: pop 0.5s ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.06); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .vendor-count.pulse { animation: none; } }
  .last-sale { font-size: 13px; opacity: 0.55; margin: 0; }
  .vendor-actions { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .big-btn {
    cursor: pointer; width: 190px; height: 190px; border-radius: 50%; background: var(--laton);
    color: var(--pizarra); border: none; font-size: 18px; font-weight: 700;
    box-shadow: 0 10px 30px rgba(200,151,58,0.35);
  }
  .undo-btn { color: #93A5B0; text-decoration: underline; font-size: 13px; }
  .error-text { color: #E7A2A2; font-size: 13px; }

  /* ---- Admin: pin ---- */
  #screen-pin { background: var(--papel); color: var(--grafito); justify-content: center; gap: 16px; }
  .pin-input {
    padding: 12px 16px; border-radius: 10px; border: 1px solid var(--borde-claro);
    background: #fff; color: var(--grafito); font-size: 16px; width: 160px; text-align: center; letter-spacing: 4px;
  }
  .pin-input.error { border-color: #C1543D; }
  .pin-error { color: #C1543D; font-size: 13px; margin: 0; }
  .btn-dark { cursor: pointer; background: var(--grafito); color: var(--papel); border: none; border-radius: 10px; padding: 12px 24px; font-size: 16px; font-weight: 600; }

  /* ---- Admin: dashboard ---- */
  #screen-admin { background: var(--papel); color: var(--grafito); align-items: stretch; padding-top: 24px; }
  .admin-wrap { max-width: 780px; margin: 0 auto; width: 100%; }
  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .admin-header .link-btn { color: #8A8371; }
  .admin-title { font-family: 'Space Grotesk'; font-size: 22px; font-weight: 700; margin: 0; }
  .filter-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-chip {
    cursor: pointer; border: 1px solid var(--borde-claro); background: #fff; color: var(--grafito);
    border-radius: 999px; padding: 8px 16px; font-size: 14px; font-weight: 500;
  }
  .filter-chip.active { background: var(--grafito); color: var(--papel); border-color: var(--grafito); }
  .empty-msg { opacity: 0.6; text-align: center; margin-top: 40px; }
  .chart-card { background: #fff; border: 1px solid var(--borde-claro); border-radius: 14px; overflow: hidden; margin-bottom: 24px; padding: 16px; }
  .bar-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
  .bar-label { width: 100px; font-size: 13px; flex-shrink: 0; text-align: right; }
  .bar-track { flex: 1; background: var(--papel); border-radius: 6px; height: 22px; overflow: hidden; }
  .bar-fill { background: var(--laton); height: 100%; border-radius: 6px 0 0 6px; transition: width 0.4s ease; }
  .bar-value { width: 28px; font-size: 13px; font-weight: 600; text-align: left; }
  .vendor-list { background: #fff; border: 1px solid var(--borde-claro); border-radius: 14px; overflow: hidden; }
  .vendor-row-btn {
    width: 100%; cursor: pointer; background: none; border: none; border-top: 1px solid var(--borde-claro);
    padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; text-align: left; font-size: 15px;
  }
  .vendor-row-btn:first-child { border-top: none; }
  .vendor-row-total { font-size: 18px; font-weight: 600; color: var(--laton); }
  .day-detail { padding: 0 18px 16px; display: flex; flex-direction: column; gap: 6px; }
  .day-detail-row { display: flex; justify-content: space-between; font-size: 13px; color: #5B5647; }

  button:focus-visible, input:focus-visible { outline: 3px solid var(--laton); outline-offset: 2px; }
</style>
</head>
<body>

<!-- HOME -->
<div id="screen-home" class="screen active">
  <div>
    <p class="home-title">Registro de Ventas</p>
    <p class="home-sub">Elige cómo vas a entrar</p>
  </div>
  <div class="home-buttons">
    <button class="btn-primary" onclick="goToNameScreen()">Soy vendedor</button>
    <button class="btn-secondary" onclick="showScreen('screen-pin')">Soy administrador</button>
  </div>
</div>

<!-- VENDOR: NAME ENTRY -->
<div id="screen-name" class="screen">
  <p style="font-size:18px; font-weight:600; margin:0;">¿Cómo te llamas?</p>
  <input id="name-input" class="name-input" placeholder="Tu nombre" oninput="onNameInput()" onkeydown="if(event.key==='Enter') confirmVendorName()" />
  <p id="name-status" class="name-status">&nbsp;</p>
  <div id="chip-row" class="chip-row"></div>
  <button id="continue-btn" class="btn-continue" disabled onclick="confirmVendorName()">Continuar</button>
  <button class="link-btn" style="color:#93A5B0; margin-top:4px;" onclick="showScreen('screen-home')">← Volver</button>
</div>

<!-- VENDOR: REGISTER -->
<div id="screen-vendor" class="screen">
  <div class="vendor-header">
    <span id="vendor-name-label" style="font-size:15px; opacity:0.75;"></span>
    <button class="link-btn" onclick="logoutVendor()">Salir</button>
  </div>
  <div class="vendor-count-wrap">
    <p class="vendor-count-label">Ventas de hoy</p>
    <p id="vendor-count" class="vendor-count num">0</p>
    <p id="last-sale" class="last-sale"></p>
  </div>
  <div class="vendor-actions">
    <button class="big-btn" onclick="registerSale()">Registrar venta</button>
    <button id="undo-btn" class="link-btn undo-btn" style="display:none;" onclick="undoLastSale()">Deshacer última venta</button>
    <p id="vendor-error" class="error-text" style="display:none;"></p>
  </div>
</div>

<!-- ADMIN: PIN -->
<div id="screen-pin" class="screen">
  <p style="font-size:18px; font-weight:600; margin:0;">Código de administrador</p>
  <input id="pin-input" class="pin-input" type="password" placeholder="••••" onkeydown="if(event.key==='Enter') checkPin()" oninput="document.getElementById('pin-input').classList.remove('error'); document.getElementById('pin-error').style.display='none';" />
  <p id="pin-error" class="pin-error" style="display:none;">Código incorrecto</p>
  <button class="btn-dark" onclick="checkPin()">Entrar</button>
  <button class="link-btn" style="color:#8A8371;" onclick="showScreen('screen-home')">← Volver</button>
</div>

<!-- ADMIN: DASHBOARD -->
<div id="screen-admin" class="screen">
  <div class="admin-wrap">
    <div class="admin-header">
      <p class="admin-title">Libro de ventas</p>
      <button class="link-btn" onclick="logoutAdmin()">Salir</button>
    </div>
    <div class="filter-row" id="filter-row"></div>
    <div id="admin-content"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  // ---- Firebase ----
  const firebaseConfig = {
    apiKey: "AIzaSyBHAMf58G6Jku9y8LP3vjY9jkjD8jxREFk",
    authDomain: "registroventasinvestra.firebaseapp.com",
    projectId: "registroventasinvestra",
    storageBucket: "registroventasinvestra.firebasestorage.app",
    messagingSenderId: "178905377011",
    appId: "1:178905377011:web:7e16e4c4527b2269e5ef86",
    measurementId: "G-B1NRPZD4HF"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const ventasCol = collection(db, "ventas");

  // ---- Config ----
  const ADMIN_CODE = "2026"; // cambia este código si lo necesitas — es solo una barrera simple, no seguridad real
  const LAST_VENDOR_KEY = "last-vendor"; // solo vive en este dispositivo, es la sesión del vendedor

  // ---- State ----
  let records = [];
  let vendorName = "";
  let justAddedId = null;
  let rangeFilter = "hoy";
  let expandedVendor = null;
  let currentScreenId = "screen-home";

  // ---- Helpers ----
  function todayISO(d = new Date()) {
    const off = d.getTimezoneOffset();
    const local = new Date(d.getTime() - off * 60000);
    return local.toISOString().slice(0, 10);
  }
  function timeLabel(d) {
    return d.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
  }
  function dateLabel(iso) {
    const [y, m, day] = iso.split("-").map(Number);
    const d = new Date(y, m - 1, day);
    return d.toLocaleDateString("es-MX", { weekday: "short", day: "numeric", month: "short" });
  }
  function showScreen(id) {
    currentScreenId = id;
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  // ---- Sesión del vendedor (por dispositivo) ----
  function loadLastVendor() {
    try {
      const last = localStorage.getItem(LAST_VENDOR_KEY);
      if (last) vendorName = last;
    } catch {
      /* localStorage no disponible en este navegador */
    }
  }
  function saveLastVendor(name) {
    try {
      localStorage.setItem(LAST_VENDOR_KEY, name);
    } catch {
      /* no crítico si falla */
    }
  }

  // ---- Base de datos compartida (Firestore) ----
  function startSalesListener() {
    const q = query(ventasCol, orderBy("timestamp", "asc"));
    onSnapshot(
      q,
      (snapshot) => {
        records = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        if (currentScreenId === "screen-vendor") renderVendorScreen();
        if (currentScreenId === "screen-admin") renderAdminScreen();
        onNameInput(); // refresca chips/estado si sigue en la pantalla de nombre
      },
      (err) => {
        console.error(err);
        showVendorError("No se pudo conectar con la base de datos.");
      }
    );
  }

  // ---- Vendor: name entry ----
  function goToNameScreen() {
    document.getElementById("name-input").value = vendorName || "";
    onNameInput();
    showScreen("screen-name");
  }
  function getExistingVendors() {
    const set = new Set();
    records.forEach(r => set.add(r.vendedor));
    return Array.from(set).sort((a, b) => a.localeCompare(b, "es"));
  }
  function onNameInput() {
    const typed = document.getElementById("name-input").value.trim();
    const input = document.getElementById("name-input");
    const status = document.getElementById("name-status");
    const continueBtn = document.getElementById("continue-btn");
    const existing = getExistingVendors();
    const match = existing.find(v => v.toLowerCase() === typed.toLowerCase()) || null;

    input.classList.toggle("matched", !!match);
    if (match) {
      status.textContent = "Usuario ya existente — vas a continuar tu registro";
      status.classList.add("matched");
    } else if (typed) {
      status.textContent = "Usuario nuevo";
      status.classList.remove("matched");
    } else {
      status.textContent = "\u00A0";
      status.classList.remove("matched");
    }
    continueBtn.disabled = !typed;

    const chipRow = document.getElementById("chip-row");
    chipRow.innerHTML = "";
    existing.forEach(v => {
      const chip = document.createElement("button");
      chip.className = "chip" + (v === match ? " matched" : "");
      chip.textContent = v;
      chip.onclick = () => { document.getElementById("name-input").value = v; onNameInput(); };
      chipRow.appendChild(chip);
    });
  }
  function confirmVendorName() {
    const name = document.getElementById("name-input").value.trim();
    if (!name) return;
    vendorName = name;
    saveLastVendor(name);
    renderVendorScreen();
    showScreen("screen-vendor");
  }
  function logoutVendor() {
    vendorName = "";
    showScreen("screen-home");
  }

  // ---- Vendor: register ----
  function renderVendorScreen() {
    document.getElementById("vendor-name-label").textContent = vendorName;
    const today = todayISO();
    const mine = records.filter(r => r.vendedor === vendorName);
    const todayCount = mine.filter(r => r.fecha === today).length;
    document.getElementById("vendor-count").textContent = todayCount;
    const lastSale = mine.sort((a, b) => b.timestamp - a.timestamp)[0];
    document.getElementById("last-sale").textContent = lastSale ? `Última venta a las ${lastSale.hora}` : "";
    document.getElementById("undo-btn").style.display = justAddedId ? "inline" : "none";
  }
  function showVendorError(msg) {
    const el = document.getElementById("vendor-error");
    el.textContent = msg;
    el.style.display = "block";
  }
  async function registerSale() {
    const btn = document.querySelector(".big-btn");
    document.getElementById("vendor-error").style.display = "none";
    btn.disabled = true;
    const now = new Date();
    const record = {
      vendedor: vendorName,
      fecha: todayISO(now),
      hora: timeLabel(now),
      timestamp: now.getTime(),
    };
    try {
      const ref = await addDoc(ventasCol, record);
      justAddedId = ref.id;
      const countEl = document.getElementById("vendor-count");
      countEl.classList.remove("pulse");
      void countEl.offsetWidth; // restart animation
      countEl.classList.add("pulse");
      renderVendorScreen();
    } catch (err) {
      console.error(err);
      showVendorError("No se pudo guardar la venta. Revisa tu conexión e intenta de nuevo.");
    } finally {
      btn.disabled = false;
    }
  }
  async function undoLastSale() {
    if (!justAddedId) return;
    try {
      await deleteDoc(doc(db, "ventas", justAddedId));
      justAddedId = null;
      renderVendorScreen();
    } catch (err) {
      console.error(err);
      showVendorError("No se pudo deshacer la venta. Intenta de nuevo.");
    }
  }

  // ---- Admin: pin ----
  function checkPin() {
    const pin = document.getElementById("pin-input").value;
    if (pin === ADMIN_CODE) {
      document.getElementById("pin-input").value = "";
      renderAdminScreen();
      showScreen("screen-admin");
    } else {
      document.getElementById("pin-input").classList.add("error");
      document.getElementById("pin-error").style.display = "block";
    }
  }
  function logoutAdmin() {
    showScreen("screen-home");
  }

  // ---- Admin: dashboard ----
  function getRangeBounds() {
    const now = new Date();
    const today = todayISO(now);
    if (rangeFilter === "hoy") return { from: today, to: today };
    if (rangeFilter === "ayer") {
      const y = new Date(now);
      y.setDate(y.getDate() - 1);
      const iso = todayISO(y);
      return { from: iso, to: iso };
    }
    if (rangeFilter === "semana") {
      const w = new Date(now);
      w.setDate(w.getDate() - 6);
      return { from: todayISO(w), to: today };
    }
    return { from: "0000-01-01", to: "9999-12-31" };
  }
  function renderFilterRow() {
    const filters = [["hoy", "Hoy"], ["ayer", "Ayer"], ["semana", "7 días"], ["todo", "Todo"]];
    const row = document.getElementById("filter-row");
    row.innerHTML = "";
    filters.forEach(([key, label]) => {
      const btn = document.createElement("button");
      btn.className = "filter-chip" + (rangeFilter === key ? " active" : "");
      btn.textContent = label;
      btn.onclick = () => { rangeFilter = key; renderAdminScreen(); };
      row.appendChild(btn);
    });
  }
  function renderAdminScreen() {
    renderFilterRow();
    const { from, to } = getRangeBounds();
    const filtered = records.filter(r => r.fecha >= from && r.fecha <= to);

    const map = {};
    filtered.forEach(r => {
      if (!map[r.vendedor]) map[r.vendedor] = { vendedor: r.vendedor, total: 0, porDia: {} };
      map[r.vendedor].total += 1;
      map[r.vendedor].porDia[r.fecha] = (map[r.vendedor].porDia[r.fecha] || 0) + 1;
    });
    const summary = Object.values(map).sort((a, b) => b.total - a.total);

    const content = document.getElementById("admin-content");
    content.innerHTML = "";

    if (summary.length === 0) {
      const p = document.createElement("p");
      p.className = "empty-msg";
      p.textContent = "Todavía no hay ventas registradas en este período.";
      content.appendChild(p);
      return;
    }

    // Chart
    const maxTotal = Math.max(...summary.map(v => v.total));
    const chartCard = document.createElement("div");
    chartCard.className = "chart-card";
    summary.forEach(v => {
      const row = document.createElement("div");
      row.className = "bar-row";
      const pct = maxTotal ? (v.total / maxTotal) * 100 : 0;
      row.innerHTML = `
        <span class="bar-label">${escapeHtml(v.vendedor)}</span>
        <span class="bar-track"><span class="bar-fill" style="width:${pct}%;"></span></span>
        <span class="bar-value num">${v.total}</span>
      `;
      chartCard.appendChild(row);
    });
    content.appendChild(chartCard);

    // Vendor list with expandable day detail
    const list = document.createElement("div");
    list.className = "vendor-list";
    summary.forEach(v => {
      const days = Object.entries(v.porDia).sort((a, b) => (a[0] < b[0] ? 1 : -1));
      const isOpen = expandedVendor === v.vendedor;

      const rowBtn = document.createElement("button");
      rowBtn.className = "vendor-row-btn";
      rowBtn.innerHTML = `<span>${escapeHtml(v.vendedor)}</span><span class="vendor-row-total num">${v.total}</span>`;
      rowBtn.onclick = () => { expandedVendor = isOpen ? null : v.vendedor; renderAdminScreen(); };
      list.appendChild(rowBtn);

      if (isOpen) {
        const detail = document.createElement("div");
        detail.className = "day-detail";
        days.forEach(([fecha, count]) => {
          const dr = document.createElement("div");
          dr.className = "day-detail-row";
          dr.innerHTML = `<span>${dateLabel(fecha)}</span><span class="num">${count} venta${count === 1 ? "" : "s"}</span>`;
          detail.appendChild(dr);
        });
        list.appendChild(detail);
      }
    });
    content.appendChild(list);
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // ---- Init ----
  loadLastVendor();
  startSalesListener();

  // Exponer al scope global: el HTML usa onclick="..." y este es un <script type="module">
  Object.assign(window, {
    goToNameScreen, showScreen, onNameInput, confirmVendorName, logoutVendor,
    registerSale, undoLastSale, checkPin, logoutAdmin,
  });
</script>
</body>
</html>
